__KATEX_CSS__
<style>
/* Layout: a typeset course reader. A masthead with three areas (Questions, Playgrounds, Labs), a reading column with wide outer margins,
   question numbers set in the margin, figures beside the text they explain. Cardinal marks emphasis; ivory paper; charcoal ink; thin rules. */
:root {
  --paper: #FBF8F1; --sheet: #FFFDF8; --sunk: #F2EDE2; --ink: #2A2826; --ink-2: #4A4642; --muted: #736D64; --rule: #DED6C6; --rule-2: #CFC5B1;
  --cardinal: #8F1B1F; --cardinal-ink: #FFFFFF; --cardinal-soft: #F6E4E1; --cardinal-line: #C9827E;
  --q: #2C5A8C; --k: #2D7650; --v: #A3660E; --q-soft: #E1EAF4; --k-soft: #DFEFE5; --v-soft: #F6EAD6;
  --good: #2D7650; --good-soft: #E0F0E5; --bad: #B0391F; --bad-soft: #F8E3DC; --warn: #8E6A12; --warn-soft: #F5EBCF;
  --grid: rgba(42, 40, 38, 0.055); --hatch: rgba(42, 40, 38, 0.22);
  --code-bg: #F4EFE4;
  --f-serif: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --measure: 66ch; --r: 4px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #171513; --sheet: #1E1B18; --sunk: #26221E; --ink: #ECE5D8; --ink-2: #D2CABB; --muted: #A49B8C; --rule: #3A342D; --rule-2: #4A4239;
  --cardinal: #E06B63; --cardinal-ink: #1A0E0D; --cardinal-soft: #3C1D1B; --cardinal-line: #9A4A45;
  --q: #86B2E3; --k: #79C89C; --v: #E3AE57; --q-soft: #1E2B3A; --k-soft: #1C3226; --v-soft: #3A2C17;
  --good: #79C89C; --good-soft: #1C3226; --bad: #EE8A70; --bad-soft: #3D2119; --warn: #E3C066; --warn-soft: #382F16;
  --grid: rgba(236, 229, 216, 0.06); --hatch: rgba(236, 229, 216, 0.28); --code-bg: #221F1B; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #171513; --sheet: #1E1B18; --sunk: #26221E; --ink: #ECE5D8; --ink-2: #D2CABB; --muted: #A49B8C; --rule: #3A342D; --rule-2: #4A4239;
  --cardinal: #E06B63; --cardinal-ink: #1A0E0D; --cardinal-soft: #3C1D1B; --cardinal-line: #9A4A45;
  --q: #86B2E3; --k: #79C89C; --v: #E3AE57; --q-soft: #1E2B3A; --k-soft: #1C3226; --v-soft: #3A2C17;
  --good: #79C89C; --good-soft: #1C3226; --bad: #EE8A70; --bad-soft: #3D2119; --warn: #E3C066; --warn-soft: #382F16;
  --grid: rgba(236, 229, 216, 0.06); --hatch: rgba(236, 229, 216, 0.28); --code-bg: #221F1B; color-scheme: dark }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-sans); font-size: 15.5px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sheet); }
h1, h2, h3, h4, h5, h6 { font-family: var(--f-serif); font-weight: 600; line-height: 1.18; margin: 0; text-wrap: balance; letter-spacing: -0.005em; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--cardinal); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--cardinal); outline-offset: 2px; border-radius: 2px; }
code, pre, .mono { font-family: var(--f-mono); font-size: 0.88em; }
code { background: var(--code-bg); padding: 0.05em 0.35em; border-radius: 3px; }
.sc { font-variant: small-caps; letter-spacing: 0.06em; text-transform: lowercase; }
.eyebrow { font-family: var(--f-sans); font-size: 11.5px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cardinal); }

/* Masthead */
.mast { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--sheet); border-bottom: 1px solid var(--rule); box-shadow: inset 0 3px 0 var(--cardinal); }
.mast-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 22px; padding-block: 12px 10px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.wordmark { display: flex; align-items: baseline; gap: 10px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.wordmark b { font-family: var(--f-serif); font-size: 21px; font-weight: 700; letter-spacing: -0.01em; }
.wordmark b span { color: var(--cardinal); }
.wordmark em { font-family: var(--f-serif); font-style: italic; color: var(--muted); font-size: 15px; }
.areas { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
.areas a { font-size: 13.5px; font-weight: 500; text-decoration: none; color: var(--ink-2); padding: 6px 11px; border-radius: 2px; border-bottom: 2px solid transparent; white-space: nowrap; }
.areas a:hover { color: var(--ink); background: var(--sunk); }
.areas a[aria-current="page"] { color: var(--cardinal); border-bottom-color: var(--cardinal); }
.areas .sep { width: 1px; background: var(--rule); margin: 6px 6px; }
.areas .count { font-family: var(--f-mono); font-size: 11.5px; color: var(--cardinal); margin-left: 4px; }

.page { max-width: 1280px; margin: 0 auto; padding-block: 34px 90px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.with-rail { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 44px; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 78px); align-self: start; max-height: calc(100vh - 100px); overflow: auto; }
.rail h6 { font-family: var(--f-sans); font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.rail ol { list-style: none; margin: 0 0 22px; padding: 0; border-left: 1px solid var(--rule); }
.rail li a, .rail li button { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; width: 100%; text-align: left; background: none; border: 0; text-decoration: none; color: var(--ink-2); font-size: 13.5px; padding: 5px 8px 5px 12px; margin-left: -1px; border-left: 2px solid transparent; cursor: pointer; }
.rail li a:hover, .rail li button:hover { color: var(--ink); }
.rail li a[aria-current="page"], .rail li button.on { color: var(--cardinal); border-left-color: var(--cardinal); }
.rail .n { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.rail .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail .p { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.mobile-jump { display: none; margin-bottom: 16px; }
.mobile-jump select { width: 100%; padding: 9px 10px; border: 1px solid var(--rule-2); border-radius: var(--r); background: var(--sheet); }

/* Headers */
.chap { border-bottom: 1px solid var(--rule); padding-bottom: 20px; margin-bottom: 26px; display: flex; flex-direction: column; gap: 10px; }
.chap h1 { font-size: clamp(30px, 4.2vw, 46px); font-weight: 600; }
.chap .lede { font-family: var(--f-serif); font-size: 18.5px; color: var(--ink-2); max-width: var(--measure); line-height: 1.55; }
.topics { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 13.5px; color: var(--muted); }
.topics span:not(:last-child)::after { content: "·"; margin: 0 9px; color: var(--rule-2); }
.progress { display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.bar { flex: 1; max-width: 320px; height: 4px; background: var(--sunk); display: flex; }
.bar i { display: block; height: 100%; }
.bar .g { background: var(--cardinal); } .bar .w { background: var(--cardinal-line); opacity: 0.45; }
.tnum { font-variant-numeric: tabular-nums; font-family: var(--f-mono); font-size: 0.92em; }

/* Home */
.hero { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 48px; align-items: end; border-bottom: 1px solid var(--rule); padding-bottom: 32px; margin-bottom: 34px; }
.hero h1 { font-size: clamp(34px, 5vw, 60px); font-weight: 600; letter-spacing: -0.015em; }
.hero h1 em { font-style: italic; color: var(--cardinal); font-weight: 400; }
.hero p { font-family: var(--f-serif); font-size: 19px; color: var(--ink-2); max-width: 56ch; margin-top: 16px; }
.hero-eq { border-left: 1px solid var(--rule); padding-left: 28px; min-width: 0; }
.hero-eq .eq { margin: 0; }
.hero-eq small { display: block; font-family: var(--f-serif); font-style: italic; color: var(--muted); margin-top: 8px; }
.areas3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); margin-bottom: 40px; }
.area { padding: 22px 24px 24px; text-decoration: none; color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.area + .area { border-left: 1px solid var(--rule); }
.area:hover { background: var(--sheet); }
.area h2 { font-size: 26px; }
.area h2 .num { font-family: var(--f-mono); font-size: 13px; color: var(--cardinal); margin-left: 8px; font-weight: 500; }
.area p { color: var(--ink-2); font-size: 14.5px; }
.area .go { margin-top: auto; font-size: 13px; color: var(--cardinal); font-weight: 600; }
.contents { list-style: none; margin: 0; padding: 0; }
.contents li { border-bottom: 1px solid var(--rule); }
.contents a { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 18px; align-items: baseline; padding: 16px 4px; text-decoration: none; color: var(--ink); }
.contents a:hover { background: var(--sheet); }
.contents .ln { font-family: var(--f-serif); font-size: 30px; color: var(--cardinal); line-height: 1; }
.contents h3 { font-size: 21px; }
.contents .tp { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
.contents .meta { font-size: 12.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.section-h { display: flex; align-items: baseline; gap: 14px; margin: 0 0 14px; }
.section-h h2 { font-size: 25px; }
.section-h .rule { flex: 1; border-top: 1px solid var(--rule); }
.disclaimer { font-size: 13px; color: var(--muted); max-width: 80ch; margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--rule); }

/* Toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 18px; }
.seg { border: 1px solid var(--rule-2); background: transparent; padding: 4px 11px; border-radius: 2px; font-size: 13px; cursor: pointer; color: var(--ink-2); }
.seg[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.toolbar .spacer { flex: 1; }
.related { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin: 0 0 26px; }
.rel-card { display: flex; gap: 12px; align-items: baseline; text-decoration: none; color: var(--ink); border: 1px solid var(--rule); border-top: 2px solid var(--cardinal); background: var(--sheet); padding: 12px 14px; }
.rel-card:hover { border-color: var(--rule-2); }
.rel-card b { font-family: var(--f-serif); font-size: 17px; font-weight: 600; }
.rel-card span { font-size: 13px; color: var(--muted); }
.rel-card .k { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cardinal); font-weight: 600; white-space: nowrap; }

/* Question */
.qs { display: flex; flex-direction: column; }
.qcard { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 0 18px; padding: 30px 0 30px; border-top: 1px solid var(--rule); scroll-margin-top: 90px; }
.qnum { font-family: var(--f-serif); font-size: 26px; color: var(--cardinal); line-height: 1.1; text-align: right; font-variant-numeric: lining-nums; }
.qnum small { display: block; font-family: var(--f-sans); font-size: 9.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.qmain { min-width: 0; }
.qhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.qhead h3 { font-size: 21px; }
.tag { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tag.calc { color: var(--v); }
.status { margin-left: auto; font-size: 12px; font-weight: 600; padding: 1px 8px; border: 1px solid; border-radius: 2px; }
.status.ok { color: var(--good); border-color: currentColor; } .status.no { color: var(--bad); border-color: currentColor; } .status.mid { color: var(--warn); border-color: currentColor; }
.qbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; }
.qbody.has-aside { grid-template-columns: minmax(0, 1fr) minmax(0, 0.92fr); grid-template-areas: "text fig" "eq eq" "ans ans"; align-items: start; column-gap: 34px; }
.qbody.has-aside .qans { max-width: 760px; }
.qbody.has-aside .qtext { grid-area: text; } .qbody.has-aside .qfig { grid-area: fig; } .qbody.has-aside .qeq { grid-area: eq; } .qbody.has-aside .qans { grid-area: ans; }
.qtext { font-family: var(--f-serif); font-size: 19px; line-height: 1.6; max-width: var(--measure); color: var(--ink); }
.qtext b { font-weight: 600; }
.qans { min-width: 0; }
.card-foot { display: flex; gap: 2px; margin-top: 14px; flex-wrap: wrap; }

/* Equations */
.eq { overflow-x: auto; overflow-y: hidden; padding: 6px 2px; margin: 0; -webkit-overflow-scrolling: touch; }
.qeq { border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; display: flex; flex-direction: column; gap: 2px; }
.qeq .katex-display { font-size: clamp(19px, 2.35vw, 31px); margin: 0.25em 0; }
.hero-eq .katex-display { font-size: clamp(17px, 1.75vw, 25px); margin: 0.25em 0; }
.eq-inline-display .katex-display { font-size: clamp(17px, 1.9vw, 25px); margin: 0.4em 0; }
.katex { font-size: 1.06em; }
.katex-display > .katex { white-space: nowrap; max-width: 100%; }
.cq { color: var(--q); } .ck { color: var(--k); } .cv { color: var(--v); } .ca { color: var(--cardinal); }

/* Answer controls */
.opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.opt { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 8px; text-align: left; background: var(--sheet); border: 1px solid var(--rule); border-radius: var(--r); padding: 10px 12px; cursor: pointer; font-size: 15px; line-height: 1.5; }
.opt:hover { border-color: var(--rule-2); }
.opt .k { font-family: var(--f-serif); font-weight: 600; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.opt.is-right { border-color: var(--good); background: var(--good-soft); box-shadow: inset 3px 0 0 var(--good); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: inset 3px 0 0 var(--bad); }
.opt:disabled { cursor: default; }
.answer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.answer-row input[type="text"] { width: 190px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--rule-2); border-radius: var(--r); background: var(--sheet); font-family: var(--f-mono); font-size: 15px; }
.unit { color: var(--muted); font-size: 13.5px; }
.btn { border: 1px solid var(--rule-2); background: var(--sheet); padding: 7px 14px; border-radius: var(--r); cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--ink); }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--cardinal); color: var(--cardinal-ink); border-color: var(--cardinal); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: 0.45; cursor: default; }
.feedback { font-size: 14.5px; margin: 10px 0 0; font-weight: 500; }
.feedback.ok { color: var(--good); } .feedback.no { color: var(--bad); }
.hint { margin-top: 12px; padding: 10px 14px; border-left: 2px solid var(--v); background: var(--v-soft); font-size: 14.5px; }
.sol { margin-top: 16px; padding: 16px 0 4px; border-top: 2px solid var(--ink); font-size: 15.5px; }
.sol-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--cardinal); margin-bottom: 6px; }
.sol-text { max-width: var(--measure); font-family: var(--f-serif); font-size: 17.5px; line-height: 1.6; }
.sol-text:has(.eq-inline-display) { max-width: none; }
.eq-inline-display .katex-display > .katex { text-align: left; }
.sol-text ul, .sol-text ol { padding-left: 20px; margin: 4px 0; }
.sol pre, .qtext pre { background: var(--code-bg); padding: 10px 12px; border-radius: var(--r); overflow-x: auto; font-size: 13px; line-height: 1.5; }
.sol .fig { margin-top: 16px; }
textarea { width: 100%; min-height: 118px; padding: 10px 12px; border: 1px solid var(--rule-2); border-radius: var(--r); background: var(--sheet); resize: vertical; line-height: 1.55; font-family: var(--f-serif); font-size: 16px; }
.rubric { display: flex; flex-direction: column; gap: 4px; margin: 12px 0; }
.rubric label { display: flex; gap: 8px; align-items: baseline; font-size: 14.5px; }
.selfrate { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; font-size: 13.5px; color: var(--muted); }
.selfrate [aria-pressed="true"] { border-color: var(--ink); }
.order-list { list-style: none; margin: 0 0 12px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-list li { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; border: 1px solid var(--rule); border-radius: var(--r); padding: 7px 8px 7px 12px; background: var(--sheet); font-size: 15px; }
.order-list li.is-right { border-color: var(--good); background: var(--good-soft); }
.order-list li.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.order-list .pos { font-family: var(--f-serif); font-weight: 600; color: var(--muted); }
.order-list .mv { display: flex; gap: 3px; }
.order-list .mv button { width: 32px; height: 30px; border: 1px solid var(--rule-2); background: var(--paper); border-radius: 3px; cursor: pointer; }
.note-box { margin-top: 10px; }
.note-box textarea { min-height: 72px; font-family: var(--f-sans); font-size: 14px; }
.note-box small { color: var(--muted); }

/* Figures: shared visual language */
.fig { margin: 0; min-width: 0; border: 1px solid var(--rule); background: var(--sheet); }
.fig-head { display: flex; align-items: baseline; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--rule); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.fig-head b { color: var(--cardinal); font-weight: 600; white-space: nowrap; }
.fig-head .kind { white-space: nowrap; }
.fig-head .kind { margin-left: auto; }
.fig-body { padding: 14px; background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 16px 16px; background-position: -1px -1px; overflow-x: auto; }
.fig figcaption { padding: 8px 12px 10px; border-top: 1px solid var(--rule); font-family: var(--f-serif); font-size: 14.5px; color: var(--ink-2); line-height: 1.45; }
.fig figcaption i { font-style: italic; color: var(--cardinal); margin-right: 4px; }
.fig-note { font-size: 13.5px; color: var(--ink-2); margin-top: 10px; }
.fig h6, .stp-frame h5 { font-family: var(--f-sans); font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0 0 8px; }
.fig-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 18px; align-items: start; }
.readout { font-family: var(--f-mono); font-size: 12.8px; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); padding: 7px 10px; margin-top: 10px; line-height: 1.55; overflow-x: auto; }
.lgd { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 12.5px; color: var(--ink-2); }
.lgd span { display: inline-flex; align-items: center; gap: 6px; }
.sw { display: inline-block; width: 14px; height: 12px; border: 1px solid var(--rule-2); background: var(--sheet); }
.sw.line { height: 0; border: 0; border-top: 2.5px solid var(--muted); width: 20px; }
.sw.line.dash { border-top-style: dashed; }
/* semantic colours */

      $("#pd-out", root).textContent = toks.map((t, i) => `${t}: ${c[i]}`).join("   "); });
    root.querySelector(".pg-reset").addEventListener("click", () => { T.value = 1; K.value = 6; P.value = 1; draw(); $("#pd-out", root).textContent = "Sample counts appear here."; });
    root.addEventListener("input", draw); draw();
  }
};
PGV.passk = {
  eq: () => BY_ID["7.2"].eq[0],
  ctl: () => `<div class="ctrl"><div class="ctrl-line"><label for="pk-n">Samples n</label><span class="tnum" id="pk-nv"></span></div><input type="range" id="pk-n" min="2" max="50" step="1" value="10"></div>
    <div class="ctrl"><div class="ctrl-line"><label for="pk-c">Correct c</label><span class="tnum" id="pk-cv"></span></div><input type="range" id="pk-c" min="0" max="10" step="1" value="3"></div>
    <div class="ctrl"><div class="ctrl-line"><label for="pk-k">Highlight k</label><span class="tnum" id="pk-kv"></span></div><input type="range" id="pk-k" min="1" max="10" step="1" value="5"></div>`,
  out: () => `<div class="pl-wrap"><svg id="pk-svg" class="pl" viewBox="0 0 560 270" role="img" aria-label="pass@k versus k"></svg></div><div class="lgd"><span><i class="sw line s-acc"></i>unbiased estimator</span><span><i class="sw line dash"></i>plug-in 1 − (1 − c/n)^k</span></div><div class="readout" id="pk-out"></div>`,
  init(root) {
    const N = $("#pk-n", root), C = $("#pk-c", root), Kk = $("#pk-k", root);
    const lc = n => { let s = 0; for (let i = 2; i <= n; i++) s += Math.log(i); return s; }, comb = (n, k) => k < 0 || k > n ? 0 : Math.exp(lc(n) - lc(k) - lc(n - k)), pk = (n, c, k) => n - c < k ? 1 : 1 - comb(n - c, k) / comb(n, k);
    const draw = () => {
      const n = +N.value; C.max = n; Kk.max = n; const c = Math.min(+C.value, n), k = Math.min(+Kk.value, n);
      $("#pk-nv", root).textContent = n; $("#pk-cv", root).textContent = c; $("#pk-kv", root).textContent = k;
      const W = 560, H = 270, L = 44, R = 14, T = 12, B = 34, x = kk => L + (kk - 1) / Math.max(1, n - 1) * (W - L - R), y = v => T + (1 - v) * (H - T - B);
      const pts = f => Array.from({ length: n }, (_, i) => `${x(i + 1).toFixed(1)},${y(f(i + 1)).toFixed(1)}`).join(" ");
      const grid = [0, 0.25, 0.5, 0.75, 1].map(v => `<line class="pl-grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="pl-t" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("");
      const xt = [...new Set([1, Math.ceil(n / 4), Math.ceil(n / 2), Math.ceil(3 * n / 4), n])].map(kk => `<text class="pl-t" x="${x(kk)}" y="${H - 14}" text-anchor="middle">${kk}</text>`).join("");
      const ub = pk(n, c, k), pl = 1 - Math.pow(1 - c / n, k);
      $("#pk-svg", root).innerHTML = `${grid}${xt}<line class="pl-axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><text class="pl-al" x="${(W) / 2}" y="${H - 1}" text-anchor="middle">k</text>
        <polyline class="pl-line dash s-mute" points="${pts(kk => 1 - Math.pow(1 - c / n, kk))}"/><polyline class="pl-line s-acc" points="${pts(kk => pk(n, c, kk))}"/>
        <line class="pl-ref" x1="${x(k)}" x2="${x(k)}" y1="${T}" y2="${H - B}"/><circle class="pl-dot s-acc" cx="${x(k)}" cy="${y(ub)}" r="5"/>`;
      $("#pk-out", root).innerHTML = `pass@${k} unbiased = ${ub.toFixed(4)}<br>pass@${k} plug-in &nbsp;= ${pl.toFixed(4)}<br>pass@1 = c/n &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;= ${(c / n).toFixed(4)}`;
    };
    root.querySelector(".pg-reset").addEventListener("click", () => { N.value = 10; C.max = 10; C.value = 3; Kk.max = 10; Kk.value = 5; draw(); });
    root.addEventListener("input", draw); draw();
  }
};
PGV.diffusion = {
  eq: () => BY_ID["8.6"].eq[0],
  ctl: () => `<div class="ctrl"><div class="ctrl-line"><label for="pf-t">Noise level t (forward)</label><span class="tnum" id="pf-tv"></span></div><input type="range" id="pf-t" min="0" max="1" step="0.01" value="0.4"></div>
    <div class="ctrl"><div class="ctrl-line"><label for="pf-steps">Steps T (reverse)</label><span class="tnum" id="pf-stepsv"></span></div><input type="range" id="pf-steps" min="1" max="10" step="1" value="5"></div>
    <div class="answer-row"><button class="btn primary" type="button" id="pf-step">Next denoising step</button></div>`,
  out: () => `<h6 class="sol-label">Forward: corrupt</h6><div class="tks" id="pf-fwd"></div><div class="readout" id="pf-info"></div>
    <h6 class="sol-label" style="margin-top:18px">Reverse: commit the most confident tokens</h6><div class="tks" id="pf-rev"></div><div class="readout" id="pf-rinfo"></div>`,
  init(root) {
    const toks = ["A", "cute", "teddy", "bear", "is", "reading", "a", "poetry", "book", "[EOS]"], u = [0.62, 0.18, 0.91, 0.44, 0.07, 0.73, 0.35, 0.86, 0.27, 0.53], conf = [0.97, 0.41, 0.66, 0.88, 0.79, 0.58, 0.47, 0.36, 0.52, 0.99];
    let committed = new Set(), step = 0, fresh = new Set();
    const drawF = () => { const t = +$("#pf-t", root).value; $("#pf-tv", root).textContent = t.toFixed(2);
      $("#pf-fwd", root).innerHTML = toks.map((w, i) => `<span class="tk ${u[i] < t ? "masked" : "s-k"}">${u[i] < t ? "[MASK]" : esc(w)}</span>`).join("");
      $("#pf-info", root).innerHTML = `${u.filter(x => x < t).length} of ${toks.length} masked (expected ${(t * toks.length).toFixed(1)}) · loss weight 1/t = ${t > 0 ? (1 / t).toFixed(2) : "∞"}`; };
    const drawR = () => { const T = +$("#pf-steps", root).value; $("#pf-stepsv", root).textContent = T;
      $("#pf-rev", root).innerHTML = toks.map((w, i) => `<span class="tk ${committed.has(i) ? (fresh.has(i) ? "s-acc" : "s-k") : "masked"}">${committed.has(i) ? esc(w) : "[MASK]"}</span>`).join("");
      $("#pf-rinfo", root).textContent = step === 0 ? `0 forward passes. Each step commits about ${(toks.length / T).toFixed(1)} tokens.` : `${step} of ${T} forward passes · ${committed.size}/${toks.length} committed` + (step >= T ? " · done" : "");
      $("#pf-step", root).disabled = step >= T; };
    $("#pf-step", root).addEventListener("click", () => { const T = +$("#pf-steps", root).value; step++; const target = Math.round(toks.length * step / T);
      const order = conf.map((c, i) => i).filter(i => !committed.has(i)).sort((a, b) => conf[b] - conf[a]); fresh = new Set(order.slice(0, target - committed.size)); fresh.forEach(i => committed.add(i)); drawR(); });
    const restart = () => { committed = new Set(); fresh = new Set(); step = 0; drawR(); };
    $("#pf-steps", root).addEventListener("input", restart); $("#pf-t", root).addEventListener("input", drawF);
    root.querySelector(".pg-reset").addEventListener("click", () => { $("#pf-t", root).value = 0.4; $("#pf-steps", root).value = 5; drawF(); restart(); });
    drawF(); drawR();
  }
};
function viewPlayground(k) {
  const p = PGS[k], v = PGV[k];
  return `<div class="with-rail"><aside class="rail" aria-label="Playgrounds"><h6>Playgrounds</h6><ol>${Object.entries(PGS).map(([kk, pp]) => `<li><a href="#play-${kk}" ${kk === k ? 'aria-current="page"' : ""}><span class="n">L${pp.lec}</span><span class="t">${pp.title}</span><span></span></a></li>`).join("")}</ol>
    <h6>Related questions</h6><ol>${p.qs.map(id => `<li><a href="#l${BY_ID[id].lec}" data-jump="${id}"><span class="n">${id}</span><span class="t">${esc(BY_ID[id].title)}</span><span></span></a></li>`).join("")}</ol></aside>
    <main>${mobileJump(Object.entries(PGS).map(([kk, pp]) => ["play-" + kk, pp.title]), "play-" + k)}
    <header class="chap"><span class="eyebrow">Playground · Lecture ${p.lec}</span><h1>${p.title}</h1><p class="lede">${p.blurb}</p></header>

    <section class="pg-layout" id="pg-root"><div class="pg-ctl">${v.ctl()}<button class="btn ghost sm pg-reset" type="button">Reset to defaults</button></div><div class="pg-out" aria-live="polite">${v.out()}</div></section></main></div>`;
}

// ---------- labs ----------
function hlPy(code) {
  const re = /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*')|\b(def|class|return|if|else|elif|for|in|while|import|from|as|not|and|or|is|None|True|False|lambda|with|raise|assert|try|except|pass|yield|break|continue)\b|\b(\d+\.?\d*(?:e-?\d+)?)\b|\b([A-Za-z_]\w*)(?=\()/g;
  let out = "", last = 0, m;
  while ((m = re.exec(code))) { out += esc(code.slice(last, m.index)); const t = esc(m[0]);
    out += m[1] ? `<span class="com">${t}</span>` : m[2] ? `<span class="str">${t}</span>` : m[3] ? `<span class="kw">${t}</span>` : m[4] ? `<span class="num">${t}</span>` : `<span class="fn">${t}</span>`; last = re.lastIndex; }
  return out + esc(code.slice(last));
}
function viewLabs() {
  return `<header class="chap"><span class="eyebrow">Write &amp; run</span><h1>Labs</h1><p class="lede">Eight NumPy labs, one per lecture. Each lists its objectives, walks through the functions to implement in order, and ends with tests you run locally.</p></header>
    <ul class="lab-list">${Object.entries(LABS).map(([n, l]) => `<li><a href="#lab${n}"><span class="ln">${n}</span><div><h3>${esc(l.title)}</h3><p>${esc(l.blurb)}</p></div><span class="meta">${l.tasks.length} tasks · Lecture ${n}</span></a></li>`).join("")}</ul>`;
}
function viewLab(n) {
  const l = LABS[n], secs = [["obj", "Objectives"], ["setup", "Setup"], ...l.tasks.map((t, i) => ["task-" + i, `Task ${i + 1} · ${t.name}`]), ["run", "Run the tests"], ["files", "Full files"]];
  return `<div class="with-rail"><aside class="rail" aria-label="On this page"><h6>Lab ${n}</h6><ol id="lab-toc">${secs.map(([id, t]) => `<li><button type="button" data-goto="${id}"><span class="n"></span><span class="t">${esc(t)}</span><span></span></button></li>`).join("")}</ol>
    <h6>Labs</h6><ol>${Object.entries(LABS).map(([k, x]) => `<li><a href="#lab${k}" ${+k === n ? 'aria-current="page"' : ""}><span class="n">${k}</span><span class="t">${esc(x.title)}</span><span></span></a></li>`).join("")}</ol></aside>
    <main>${mobileJump(Object.entries(LABS).map(([k, x]) => ["lab" + k, `Lab ${k}: ${x.title}`]), "lab" + n)}
    <header class="chap"><span class="eyebrow">Lab ${n} · Lecture ${n}: ${esc(LECTURES[n - 1].title)}</span><h1>${esc(l.title)}</h1><p class="lede">${esc(l.blurb)}</p>
      <div class="answer-row"><a class="btn sm" href="#l${n}">Lecture ${n} questions</a>${n > 1 ? `<a class="btn ghost sm" href="#lab${n - 1}">← Lab ${n - 1}</a>` : ""}${n < 8 ? `<a class="btn ghost sm" href="#lab${n + 1}">Lab ${n + 1} →</a>` : ""}</div></header>
    <section class="lab-sec" id="sec-obj"><h2><span class="sn">01</span>Objectives</h2><p>By the end of this lab your code will:</p><ul class="objectives">${l.tasks.map(t => `<li><code>${esc(t.name)}</code>: ${esc(t.doc.split("\n")[0])}</li>`).join("")}</ul></section>
    <section class="lab-sec" id="sec-setup"><h2><span class="sn">02</span>Setup</h2><p>You need Python 3.9+ and NumPy. Copy the starter file, save it as <code>lab${n}.py</code>, and fill in each <code>raise NotImplementedError("TODO")</code>, working through the tasks below in order.</p>
      <div class="code-bar"><button class="btn primary sm" type="button" data-copy="starter">Copy starter file</button><span class="unit" data-msg aria-live="polite"></span></div><pre class="code">pip install numpy</pre></section>
    ${l.tasks.map((t, i) => `<section class="lab-sec" id="sec-task-${i}"><h2><span class="sn">${String(i + 3).padStart(2, "0")}</span>Task ${i + 1}: <code>${esc(t.name)}</code></h2><p>${esc(t.doc).replace(/\n/g, "<br>")}</p>
      <div class="task"><div class="task-h"><span class="tn">Starter</span><b>${esc(t.sig)}</b></div><pre class="code">${hlPy(t.starter)}</pre></div>
      <details class="task"><summary class="task-h"><span class="tn">Reference</span><span>Show the reference implementation</span></summary><pre class="code">${hlPy(t.solution)}</pre></details></section>`).join("")}
    <section class="lab-sec" id="sec-run"><h2><span class="sn">${String(l.tasks.length + 3).padStart(2, "0")}</span>Run the tests</h2><p>The tests at the bottom of the file check each task, including the worked examples from the lecture's questions.</p>
      <pre class="code">${hlPy(l.tests)}</pre><p style="margin-top:12px">Expected output when every task is done:</p><div class="out-block"><span class="p">$</span> python lab${n}.py<br>All Lab ${n} tests passed.</div></section>
    <section class="lab-sec" id="sec-files"><h2><span class="sn">${String(l.tasks.length + 4).padStart(2, "0")}</span>Full files</h2>
      <div class="code-bar"><div class="seg-g" role="radiogroup" aria-label="Choose file" style="margin:0"><button type="button" role="radio" class="segb" data-file="starter" aria-checked="true">Starter</button><button type="button" role="radio" class="segb" data-file="solution" aria-checked="false">Reference solution</button></div><button class="btn sm" type="button" data-copy="current">Copy this file</button><span class="unit" data-msg aria-live="polite"></span></div>
      <pre class="code tall" id="lab-code">${hlPy(l.starter)}</pre></section></main></div>`;
}
function initLab(n, root) {
  const l = LABS[n]; let file = "starter";
  root.addEventListener("click", async ev => {
    const g = ev.target.closest("[data-goto]"); if (g) { $("#sec-" + g.dataset.goto)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); return; }
    const f = ev.target.closest("[data-file]"); if (f) { file = f.dataset.file; root.querySelectorAll("[data-file]").forEach(b => b.setAttribute("aria-checked", String(b === f))); $("#lab-code").innerHTML = hlPy(l[file]); return; }
    const c = ev.target.closest("[data-copy]"); if (!c) return;
    const text = c.dataset.copy === "starter" ? l.starter : l[file], msg = c.parentElement.querySelector("[data-msg]");
    try { await navigator.clipboard.writeText(text); msg.textContent = "Copied."; } catch (e) { msg.textContent = "Copy blocked: select the code below and copy it."; }
  });
  const secs = [...root.querySelectorAll(".lab-sec")], btns = [...root.querySelectorAll("#lab-toc [data-goto]")];
  if ("IntersectionObserver" in window) { const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) btns.forEach(b => b.classList.toggle("on", "sec-" + b.dataset.goto === e.target.id)); }), { rootMargin: "-20% 0px -70% 0px" }); secs.forEach(s => io.observe(s)); }
}

// ---------- router ----------
function route() {
  const h = (location.hash || "#home").slice(1), view = $("#view");
  currentLec = null;
  if (/^l[1-8]$/.test(h)) { currentView = h; currentLec = +h.slice(1); view.innerHTML = viewLecture(currentLec);
    view.querySelectorAll(".qcard").forEach(c => { hydrate(c); restoreCard(c, BY_ID[c.dataset.id]); }); applyFilter();
    if (S.ui.jump) { const t = document.getElementById("q-" + S.ui.jump.replace(".", "-")); S.ui.jump = null; if (t) setTimeout(() => t.scrollIntoView(), 0); } }
  else if (h === "questions") { currentView = h; view.innerHTML = viewQuestions(); }
  else if (h === "playgrounds") { currentView = h; view.innerHTML = viewPlaygrounds(); }
  else if (/^play-(attention|multihead|decoding|passk|diffusion)$/.test(h)) { currentView = h; const k = h.slice(5); view.innerHTML = viewPlayground(k); PGV[k].init($("#pg-root")); }
  else if (h === "labs") { currentView = h; view.innerHTML = viewLabs(); }
  else if (/^lab[1-8]$/.test(h)) { currentView = h; view.innerHTML = viewLab(+h.slice(3)); initLab(+h.slice(3), view); }
  else if (h === "review") { currentView = h; view.innerHTML = viewReview(); view.querySelectorAll(".qcard").forEach(hydrate); }
  else if (h === "notes") { currentView = h; view.innerHTML = viewNotes(); }
  else { currentView = "home"; view.innerHTML = viewHome(); }
  refreshChrome();
}
const viewEl = $("#view");
viewEl.addEventListener("click", ev => {
  onCardClick(ev);
  const j = ev.target.closest("[data-jump]"); if (j) S.ui.jump = j.dataset.jump;
  const f = ev.target.closest("[data-filter]"); if (f) { S.ui.filter = f.dataset.filter; save(); document.querySelectorAll("[data-filter]").forEach(b => b.setAttribute("aria-pressed", String(b === f))); applyFilter(); }
  if (ev.target.id === "rv-mixed") { mixedIds = seededShuffle(ALL.map(e => e.id), String(Date.now())).slice(0, 10); route(); }
  if (ev.target.id === "rv-queue") { mixedIds = null; route(); }
  if (ev.target.id === "reset-all") $("#reset-zone").innerHTML = `<span class="confirm">Erase all answers and notes in this browser? <button class="btn sm" type="button" id="reset-yes">Erase</button><button class="btn ghost sm" type="button" id="reset-no">Cancel</button></span>`;
  if (ev.target.id === "reset-no") route();
  if (ev.target.id === "reset-yes") { S = { ex: {}, notes: {}, general: "", ui: {} }; save(); route(); }
  if (ev.target.id === "copy-email") { navigator.clipboard.writeText($("#email").textContent).then(() => { $("#copy-msg").textContent = "Copied."; }).catch(() => { const r = document.createRange(); r.selectNodeContents($("#email")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#copy-msg").textContent = "Selected. Press Ctrl+C or ⌘C to copy."; }); }
});
viewEl.addEventListener("input", ev => { onCardInput(ev); if (ev.target.id === "general-note") { S.general = ev.target.value; save(); $("#email").textContent = emailDraft(); refreshChrome(); } });
viewEl.addEventListener("change", ev => { onCardInput(ev); if (ev.target.id === "mjump") location.hash = ev.target.value; });
viewEl.addEventListener("keydown", onCardKey);
window.addEventListener("hashchange", () => { if (location.hash !== "#review") mixedIds = null; route(); window.scrollTo(0, 0); });
route();
})();
</script>
